<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
		<title>MIDI Player</title>
		<script src="turbosynthwasm.js"></script>
		<script src="audioplayer.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
		<script>
var TurboSynth;
var EasyMidi;
var EasyMidi_New;
var EasyMidi_GetSynth;
var EasyMidi_Load;
var EasyMidi_IsFinished;
var EasyMidi_RenderFloat;
var EasyMidi_Reset;
var EasyMidi_Destroy;
var EasyMidi_BufferPointer;
var EasyMidi_Buffer;

var WaveSynth;
var WaveSynth_Note;
var WaveSynth_SetProgram;
var WaveSynth_Reset;

var defaultMidi;

var audioContext;

var player;
var started = false;

async function load(){
	document.getElementById("play").disabled = true;
	document.getElementById("pause").disabled = true;

	if(player && !player.onended){
		player.onended = load;

		player.shutdown();

		return;
	}else if(player){
		player.pause();
		player = null;
		audioContext = null;
	}

	if(EasyMidi_BufferPointer){
		TurboSynth._free(EasyMidi_BufferPointer);
		EasyMidi_BufferPointer = null;
		EasyMidi_Destroy(EasyMidi);
	}

	TurboSynth = await TurboSynthWASM();

	EasyMidi_New = TurboSynth.cwrap("EasyMidi_New", "number", ["string", "number"]);
	EasyMidi_GetSynth = TurboSynth.cwrap("EasyMidi_GetSynth", "number", ["number"]);
	EasyMidi_Load = TurboSynth.cwrap("EasyMidi_Load", "number", ["number", "string"]);
	EasyMidi_IsFinished = TurboSynth.cwrap("EasyMidi_IsFinished", "number", ["number"]);
	EasyMidi_RenderFloat = TurboSynth.cwrap("EasyMidi_RenderFloat", null, ["number", "number", "number"]);
	EasyMidi_Reset = TurboSynth.cwrap("EasyMidi_Reset", null, ["number"]);
	EasyMidi_Destroy = TurboSynth.cwrap("EasyMidi_Destroy", null, ["number"]);

	WaveSynth_Note = TurboSynth.cwrap("WaveSynth_Note", null, ["number", "number", "number", "number"])
	WaveSynth_SetProgram = TurboSynth.cwrap("WaveSynth_SetProgram", null, ["number", "number", "number", "number"]);
	WaveSynth_Reset = TurboSynth.cwrap("WaveSynth_Reset", null, ["number"]);

	const zip = await JSZip.loadAsync(await (await fetch(document.getElementById("soundfont").value)).arrayBuffer());

	for(let i of Object.keys(zip.files)){
		if(zip.files[i].dir){
			TurboSynth.FS.mkdir(i);
		}else{
			TurboSynth.FS.writeFile(i, await zip.files[i].async("arraybuffer"));
		}
		console.log("loaded " + i);
	}

	if(!defaultMidi) defaultMidi = await (await fetch("shanghai.mid")).arrayBuffer();

	TurboSynth.FS.writeFile("input.mid", defaultMidi);

	if((EasyMidi = EasyMidi_New(Object.keys(zip.files).find(x=>x.endsWith(".cfg")), 44100)) == 0) return;	
	console.log("synthesizer loaded");

	WaveSynth = EasyMidi_GetSynth(EasyMidi);

	if(started){
		start();
	}

	document.getElementById("play").disabled = false;
};

window.onload = load;

function start(){
	if(!audioContext){
		audioContext = new (window.AudioContext || window.webkitAudioContext)();

		audioContext.resume();

		player = new AudioPlayer(audioContext, 44100);

		EasyMidi_BufferPointer = TurboSynth._malloc(2 * player.frames * 4);
		EasyMidi_Buffer = new Float32Array(TurboSynth.HEAPF32.buffer, EasyMidi_BufferPointer);
		
		player.onbuffer = function(audioBuffer, frames){
			const lChannelData = audioBuffer.getChannelData(0);
			const rChannelData = audioBuffer.getChannelData(1);

			EasyMidi_RenderFloat(EasyMidi, EasyMidi_BufferPointer, frames);

			for(let i = 0; i < frames; i++){
				lChannelData[i] = EasyMidi_Buffer[2 * i + 0];
				rChannelData[i] = EasyMidi_Buffer[2 * i + 1];
			}
		};

		document.getElementById("pause").disabled = false;

		player.resume();

		started = true;
	}
}

function play(){
	const file = document.getElementById("file");

	function loadMidi(){
		EasyMidi_Reset(EasyMidi);
		if(!EasyMidi_Load(EasyMidi, "input.mid")) return;	
		console.log("midi loaded");
	}

	start();

	if(file.files[0]){
		const reader = new FileReader();

		reader.onload = function() {
			TurboSynth.FS.writeFile("input.mid", reader.result);
			loadMidi();
		};

		reader.readAsArrayBuffer(file.files[0]);
	}else{
		TurboSynth.FS.writeFile("input.mid", defaultMidi);
		loadMidi();
	}
}

function pause(){
	player.paused = !player.paused;
}

function webMidi(){
	navigator.requestMIDIAccess().then((midi)=>{
		for(const entry of midi.inputs){
			entry[1].onmidimessage = (msg)=>{
				const data = msg.data;
				const ch = data[0] & 0xf;

				switch(data[0] & 0xf0){
					case 0x80:
						WaveSynth_Note(WaveSynth, ch, data[1], 0);
						break;
					case 0x90:
						WaveSynth_Note(WaveSynth, ch, data[1], data[2]);
						break;
					case 0xc0:
						WaveSynth_SetProgram(WaveSynth, ch, data[1], ch == 9);
						break;
				}
			};
		}

		start();
	});
}

function reset(){
	WaveSynth_Reset(WaveSynth);
}

setInterval(()=>{
	if(audioContext && document.getElementById("loop").checked && EasyMidi_IsFinished(EasyMidi)){
		play();
	}
}, 100);
		</script>
	</head>
	<body>
		<h1>MIDI Player (Powered by <a href="https://forgejo.nishi.boats/pyrite-dev/pmidi">TurboSynth</a>)</h1>
		<hr>
		<p>
			<input type="file" id="file" accept=".mid">
			<input type="button" value="Play" onclick="play()" id="play">
			<input type="button" value="Pause" onclick="pause()" id="pause">
			<input type="button" value="Clear" onclick="document.getElementById('file').value = ''">
		</p>
		<p>
			Soundfont:
			<select id="soundfont" onchange="load()">
				<option value="florestan.zip">Florestan</option>
				<option value="sc55.zip">SC55 (Missing on some servers)</option>
				<option value="ct2mgm.zip">CT2MGM (Missing on some servers)</option>
				<option value="msgs.zip">MSGS (Missing on some servers)</option>
			</select>
		</p>
		<p>
			<input type="checkbox" name="loop" id="loop">
			<label for="loop">Loop?</label>
		</p>
		<p>
			<input type="button" value="Use Web MIDI" onclick="webMidi()">
			<input type="button" value="Reset" onclick="reset()">
		</p>
		<p>
			If you don't select any files, default MIDI gets played...
		</p>
	</body>
</html>
